# RabbitMQ 4.1 Configuration for ASCII Sky
# ==========================================

# Disable deprecated management_metrics_collection feature
# This feature is deprecated in RabbitMQ 4.1 and will be removed in future versions
# We explicitly disable it to avoid deprecation warnings
deprecated_features.permit.management_metrics_collection = false

# Management Plugin Configuration
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# AMQP Configuration
listeners.tcp.default = 5672

# Default User (overridden by environment variables)
# default_user = admin
# default_pass = password
# default_vhost = /

# Performance Tuning
# Quorum queues are the default in RabbitMQ 4.x
# queue_master_locator = min-masters

# Logging
log.console = true
log.console.level = warning
log.file = false

# Memory and Disk Thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Connection Limits
channel_max = 2048
