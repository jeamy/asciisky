<!DOCTYPE html>
<html>
<head>
    <title>ASCII Sky - Celestial Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./static/css/navigationArrows.css">
    <link rel="stylesheet" href="./static/css/loadingIndicator.css">
    <link rel="stylesheet" href="./static/css/labels.css">
    <link rel="stylesheet" href="./static/css/app.css">
    <link rel="stylesheet" href="./static/css/timeControls.css">
    <link rel="stylesheet" href="./static/css/cacheStatus.css">
    <link rel="stylesheet" href="./static/css/timeInputDialog.css">
    <link rel="stylesheet" href="./static/css/objectCountDisplay.css">
    <link rel="stylesheet" href="./static/css/constellations.css">
    <link rel="stylesheet" href="./static/css/visibleObjects.css">
    <link rel="stylesheet" href="./static/css/magnitudeFilter.css">
</head>
<body>
<header>
    <h1 id="app-title">🌌 ASCII Sky Tracker</h1>
    <div class="header-controls">
        <button id="help-btn" class="control-btn" title="Hilfe">?</button>
        <button id="location-btn" class="control-btn" title="Standort ändern">📍</button>
        <div class="language-selector">
            <button id="lang-de" class="lang-btn active">DE</button>
            <button id="lang-en" class="lang-btn">EN</button>
        </div>
    </div>
    <div class="status-bar">
        <div id="click-info">Click on any object for details</div>
        <div id="last-updated">-</div>
    </div>
</header>
    
<div class="controls">
    <div class="object-list" id="object-list">
        <!-- Will be populated by JavaScript -->
    </div>
    <!-- Magnitude-Filter wurden entfernt -->
</div>
    
<!-- Simulated Time Controls (extended): << < + > >> -->
<div id="sim-time-controls" class="sim-time-controls sim-time-extended">
    <div class="sim-time-buttons-wrapper">
        <button id="sim-day-minus" class="sim-time-btn" title="-1 Tag">&laquo;</button>
        <button id="sim-hour-minus" class="sim-time-btn" title="-1 Stunde">&lsaquo;</button>
        <button id="sim-now" class="sim-time-btn sim-time-now" title="Jetzt">+</button>
        <button id="sim-hour-plus" class="sim-time-btn" title="+1 Stunde">&rsaquo;</button>
        <button id="sim-day-plus" class="sim-time-btn" title="+1 Tag">&raquo;</button>
    </div>
    <div id="sim-time-local" class="sim-time-local">—</div>
</div>
    
<div id="loading-indicator" class="loading-indicator" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span class="text">Loading...</span>
</div>
    
<div class="main-layout">
    <div class="left-panels">
        <aside id="visible-objects-panel" class="visible-objects-panel" aria-live="polite"></aside>
        <aside id="cache-status-panel" class="cache-status-panel" aria-live="polite"></aside>
    </div>
    <div id="sky-container" class="sky-container">
        <!-- Sky will be rendered here -->
    </div>
</div>
    
<script type="module">
    import { SkyRenderer } from './static/js/skyRenderer.js';
    import { initializeSkyTracker, updateSky } from './static/js/skyManager.js';
    import { CONFIG, OBJECT_SYMBOLS, ASTRO_CONSTANTS } from './static/js/constants.js';
    import { setLanguage, getCurrentLanguage, t } from './static/js/i18n.js';
    import { LocationDialog } from './static/js/locationDialog.js';
    import { TimeInputDialog } from './static/js/timeInputDialog.js';
    import { settingsManager } from './static/js/settings.js';
    import { initCacheStatusPanel, updateCacheStatusForLocation, updateCacheStatusForLocationDebounced } from './static/js/cacheStatusPanel.js';
    import { initVisibleObjectsList, updateVisibleObjectsList } from './static/js/visibleObjectsList.js';
    import { MagnitudeFilterDialog } from './static/js/magnitudeFilterDialog.js';
    
    let renderer;
    let locationDialog;
    let magnitudeFilterDialog;
    let __csSecondPassTimer = null;
    
    function refreshCacheStatus() {
        try {
            const loc = settingsManager.getLocation();
            if (loc) {
                // debounced to avoid spamming during rapid simulated time changes
                updateCacheStatusForLocationDebounced(loc.latitude, loc.longitude, loc.elevation, loc.name);
            }
        } catch (_) { /* noop */ }
    }

    // Initialize app
    document.addEventListener('DOMContentLoaded', async () => {
        // 1) Einstellungen initialisieren und Session-Standort bevorzugen
        await settingsManager.initialize();

        // 2) Renderer initialisieren (nutzt jetzt den Session-Standort)
        renderer = initializeSkyTracker();
        
        // 3) Standort-Dialog initialisieren
        locationDialog = new LocationDialog(handleLocationChange);
        
        // 3a) Magnitude-Filter-Dialog initialisieren
        magnitudeFilterDialog = new MagnitudeFilterDialog();
        
        // 3b) Cache-Status-Panel initialisieren
        initCacheStatusPanel();
        
        // 3c) Visible Objects Panel initialisieren (nach Renderer-Erstellung)
        setTimeout(() => {
            initVisibleObjectsList('visible-objects-panel', renderer, magnitudeFilterDialog);
        }, 100);
        
        // 4) UI nach kurzer Verzögerung aufbauen und Standort anwenden
        setTimeout(() => {
            setupObjectList();
            setupLanguageButtons();
            setupHelpButton();
            setupLocationButton();
            setupSimTimeControls();
            setupMagnitudeFilters();
            updateUITexts();
            
            // Übernehme aktuellen (Session-)Standort in UI und SkyManager
            loadSavedLocation();
            // Und aktualisiere Cache-Status entsprechend
            refreshCacheStatus();
        }, 500);
    });

    function loadSavedLocation() {
        try {
            const loc = settingsManager.getLocation();
            if (!loc) return;

            // App-Titel aktualisieren
            updateAppTitle(loc.name);

            // Standort im SkyManager setzen und sofort updaten
            if (renderer && renderer.skyManager) {
                renderer.skyManager.setLocation(loc.latitude, loc.longitude, loc.elevation);
                updateSky();
            }

            // Cache-Status für aktuellen Standort aktualisieren
            try { updateCacheStatusForLocation(loc.latitude, loc.longitude, loc.elevation, loc.name); } catch (_) { /* noop */ }

            // Dialog-Defaults aktualisieren
            if (locationDialog) {
                locationDialog.currentLocation = {
                    lat: loc.latitude,
                    lon: loc.longitude,
                    elevation: loc.elevation,
                    name: loc.name || 'Unbekannt'
                };
            }

            // LocalStorage aus Kompatibilitätsgründen synchron halten
            try {
                const legacy = {
                    lat: loc.latitude,
                    lon: loc.longitude,
                    elevation: loc.elevation,
                    name: loc.name || 'Unbekannt'
                };
                localStorage.setItem('asciisky_location', JSON.stringify(legacy));
            } catch (_) { /* noop */ }
        } catch (error) {
            console.error('Error applying location after init:', error);
        }
    }
        
        // Funktion zum Einrichten der Sprachauswahl-Buttons
        function setupLanguageButtons() {
            const btnDE = document.getElementById('lang-de');
            const btnEN = document.getElementById('lang-en');
            
            btnDE.addEventListener('click', () => {
                setLanguage('de');
                updateLanguageButtons();
                updateUITexts();
                if (renderer) updateSky();
            });
            
            btnEN.addEventListener('click', () => {
                setLanguage('en');
                updateLanguageButtons();
                updateUITexts();
                if (renderer) updateSky();
            });
            
            // Initialen Zustand setzen
            updateLanguageButtons();
        }
        
        // Aktualisiert die Sprachbuttons basierend auf der aktuellen Sprache
        function updateLanguageButtons() {
            const currentLang = getCurrentLanguage();
            document.getElementById('lang-de').classList.toggle('active', currentLang === 'de');
            document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
        }
        
        // Aktualisiert alle UI-Texte basierend auf der aktuellen Sprache
        function updateUITexts() {
            document.getElementById('click-info').textContent = t('click_info');
            
            // Aktualisiere die Objektnamen in der Objektliste
            document.querySelectorAll('.object-btn').forEach(btn => {
                const name = btn.dataset.objectName;
                if (name) {
                    const displayName = t(name) || name.charAt(0).toUpperCase() + name.slice(1);
                    // Erhalte das Symbol und füge es wieder hinzu
                    const symbol = OBJECT_SYMBOLS[name] || '';
                    btn.innerHTML = `${symbol} ${displayName}`;
                }
            });
            
            // Aktualisiere den Sternbilder-Button, wenn vorhanden
            const constellationBtn = document.getElementById('constellation-toggle');
            if (constellationBtn) {
                constellationBtn.innerHTML = '✦ ' + t('constellations');
                constellationBtn.title = t('toggle_constellations');
            }
            
            // Aktualisiere den Standort-Button-Tooltip
            document.getElementById('location-btn').title = t('location_settings');
            
            // Aktualisiere den App-Titel mit i18n
            updateAppTitle();

            // Simulierte Zeit: kompakte UI hat keine Labels
            updateSimPreview();
            // Sprachenwechsel auch auf Cache-Status anwenden
            refreshCacheStatus();
        }
        
        // Funktion zum Aktualisieren des App-Titels
        function updateAppTitle(locationName) {
            const appTitle = document.getElementById('app-title');
            if (locationName) {
                appTitle.textContent = `🌌 ${t('app_title')} - ${locationName}`;
            } else {
                appTitle.textContent = `🌌 ${t('app_title')}`;
            }
        }
        
        // Funktion zum Einrichten des Hilfe-Buttons
        function setupHelpButton() {
            const helpBtn = document.getElementById('help-btn');
            helpBtn.addEventListener('click', () => {
                loadCSSFile('./static/css/dialogStyles.css');
                showHelpDialog();
            });
        }

        // Funktion zum Anzeigen des Hilfe-Dialogs
        function showHelpDialog() {
            const helpContent = `
                <h3>${t('help_title') || 'Hilfe - ASCII Sky Tracker'}</h3>
                
                <h4>${t('help_controls') || 'Steuerung'}</h4>
                <ul>
                    <li><strong>📍 ${t('location_button') || 'Standort-Button'}:</strong> ${t('help_location') || 'Ändert den Beobachtungsstandort (Breiten-/Längengrad und Höhe)'}</li>
                    <li><strong>« ‹ + › »:</strong> ${t('help_time_controls') || 'Zeitsteuerung - Tag zurück, Stunde zurück, Jetzt (Echtzeit), Stunde vor, Tag vor'}</li>
                    <li><strong>${t('help_time_display') || 'Zeitanzeige'}:</strong> ${t('help_time_display_desc') || 'Klickbar, um ein beliebiges Datum und eine beliebige Uhrzeit für die Simulation einzugeben'}</li>
                    <li><strong>DE/EN:</strong> ${t('help_language') || 'Sprachwechsel zwischen Deutsch und Englisch'}</li>
                </ul>

                <h4>${t('help_sky_view') || 'Himmelsansicht'}</h4>
                <ul>
                    <li><strong>${t('help_object_click') || 'Objekt anklicken'}:</strong> ${t('help_object_click_desc') || 'Zeigt Details wie Position, Helligkeit und Auf-/Untergangszeiten'}</li>
                    <li><strong>${t('help_navigation') || 'Navigation'}:</strong> ${t('help_navigation_desc') || 'Pfeile links/rechts verschieben den Horizont um 5° (N, O, S, W sichtbar machen)'}</li>
                    <li><strong>${t('help_zoom_pan') || 'Zoom und Pan'}:</strong> ${t('help_zoom_pan_desc') || 'Am Desktop können Sie über den Zoom-Button die Ansicht vergrößern. Bei gezoomter Ansicht können Sie mit gedrückter Maustaste die Ansicht nach oben und unten verschieben.'}</li>
                    <li><strong>${t('help_symbols') || 'Symbole'}:</strong> ${t('help_symbols_desc') || 'Himmelsobjekte werden durch folgende Symbole dargestellt:'}</li>
                </ul>
                <div style="margin-left: 20px;">
                    <table style="border-collapse: separate; border-spacing: 10px 5px;">
                        <tr><td>☉</td><td>${t('symbol_sun') || 'Sonne'}</td></tr>
                        <tr><td colspan="2">${t('symbol_moon') || 'Mond (phasenabhängig)'}</td></tr>
                        <tr><td colspan="2" style="font-size: 0.9em; padding-left: 20px;">${t('symbol_moon_phases') || 'Mondphasen: 🌑 Neumond, 🌒 zunehmende Sichel, 🌓 erstes Viertel, 🌔 zunehmend, 🌕 Vollmond, 🌖 abnehmend, 🌗 letztes Viertel, 🌘 abnehmende Sichel'}</td></tr>
                        <tr><td>☿</td><td>${t('symbol_mercury') || 'Merkur'}</td></tr>
                        <tr><td>♀</td><td>${t('symbol_venus') || 'Venus'}</td></tr>
                        <tr><td>♂</td><td>${t('symbol_mars') || 'Mars'}</td></tr>
                        <tr><td>♃</td><td>${t('symbol_jupiter') || 'Jupiter'}</td></tr>
                        <tr><td>♄</td><td>${t('symbol_saturn') || 'Saturn'}</td></tr>
                        <tr><td>⚸</td><td>${t('symbol_asteroid') || 'Asteroiden'}</td></tr>
                        <tr><td>☄</td><td>${t('symbol_comet') || 'Kometen'}</td></tr>
                    </table>
                </div>
                <ul>
                </ul>

                <h4>${t('help_object_list') || 'Objektliste'}</h4>
                <p>${t('help_object_list_desc') || 'Klick auf Objekttyp (Sonne, Mond, Planeten, etc.) markiert alle Objekte dieses Typs im Himmel.'}</p>

                <h4>${t('help_magnitude_filters') || 'Helligkeitsfilter'}</h4>
                <p>${t('help_magnitude_filters_desc') || 'Über den ⚙️-Button unter "Sichtbare Objekte" können Sie die Helligkeitsfilter für Asteroiden und Kometen anpassen (Magnitude 10-20). Bei Änderung der Filter werden die Daten neu berechnet, was einige Minuten dauern kann. Die Objekte werden automatisch angezeigt, sobald sie verfügbar sind.'}</p>

                <h4>${t('help_simulation')}</h4>
                <p>${t('help_simulation_desc')}</p>
                <ul>
                    <li><strong>«</strong> ${t('help_day_minus')}</li>
                    <li><strong>‹</strong> ${t('help_hour_minus')}</li>
                    <li><strong>+</strong> ${t('help_now')}</li>
                    <li><strong>›</strong> ${t('help_hour_plus')}</li>
                    <li><strong>»</strong> ${t('help_day_plus')}</li>
                </ul>
                <p>${t('help_simulation_desc2')}</p>

                <h4>${t('help_location_change')}</h4>
                <p>${t('help_location_change_desc')}</p>

                <h4>${t('help_github')}</h4>
                <p>${t('help_github_desc')}</p>
                <p><a href="https://github.com/jeamy/asciisky" target="_blank" style="color: var(--primary-color); text-decoration: underline;">https://github.com/jeamy/asciisky</a></p>
            `;

            // Erstelle Dialog-Container
            const dialog = document.createElement('div');
            dialog.className = 'help-dialog-overlay';
            dialog.innerHTML = `
                <div class="help-dialog">
                    <button class="dialog-close" onclick="this.closest('.help-dialog-overlay').remove()">×</button>
                    <div class="help-content">${helpContent}</div>
                </div>
            `;

            document.body.appendChild(dialog);

            // Schließe Dialog bei Klick außerhalb
            dialog.addEventListener('click', (e) => {
                if (e.target === dialog) {
                    dialog.remove();
                }
            });
        }

        // Funktion zum Einrichten des Standort-Buttons
        function setupLocationButton() {
            const locationBtn = document.getElementById('location-btn');
            locationBtn.addEventListener('click', () => {
                // Lade die CSS-Datei für den Standort-Dialog
                loadCSSFile('./static/css/dialogStyles.css');
                // Zeige den Dialog an
                locationDialog.show();
            });
        }

        // Simulierte Zeit: erweiterte UI (<< < + > >>)
        function setupSimTimeControls() {
            try {
                const btnDayMinus = document.getElementById('sim-day-minus');
                const btnHourMinus = document.getElementById('sim-hour-minus');
                const btnNow = document.getElementById('sim-now');
                const btnHourPlus = document.getElementById('sim-hour-plus');
                const btnDayPlus = document.getElementById('sim-day-plus');
                const timeDisplay = document.getElementById('sim-time-local');

                if (!btnDayMinus || !btnHourMinus || !btnNow || !btnHourPlus || !btnDayPlus || !timeDisplay) return;
                
                // Erstelle den TimeInputDialog
                const timeInputDialog = new TimeInputDialog(async (offsetMinutes) => {
                    // Callback für Zeitänderungen
                    updateSimPreview();
                    if (renderer) {
                        await updateSky();
                        // Refresh object dialog if visible (after update completes)
                        renderer.refreshDialogIfVisible();
                    }
                    // Refresh cache status
                    try { refreshCacheStatus(); } catch (_) { /* noop */ }
                    try { if (__csSecondPassTimer) clearTimeout(__csSecondPassTimer); } catch (_) { /* noop */ }
                    __csSecondPassTimer = setTimeout(() => { try { refreshCacheStatus(); } catch (_) { /* noop */ } }, 3000);
                });

                const applyDelta = async (delta) => {
                    const { offsetMinutes } = settingsManager.getSimulatedTimeOffset();
                    const next = Math.max(-525600, Math.min(525600, (offsetMinutes || 0) + delta));
                    settingsManager.setSimulatedTime(next);
                    updateSimPreview();
                    if (renderer) {
                        await updateSky();
                        // Refresh object dialog if visible (after update completes)
                        renderer.refreshDialogIfVisible();
                    }
                    // Refresh cache status to reflect (potential) background precompute triggered by simulated time
                    try { refreshCacheStatus(); } catch (_) { /* noop */ }
                    // Debounced second pass 3s later, avoid stacking multiple timers
                    try { if (__csSecondPassTimer) clearTimeout(__csSecondPassTimer); } catch (_) { /* noop */ }
                    __csSecondPassTimer = setTimeout(() => { try { refreshCacheStatus(); } catch (_) { /* noop */ } }, 3000);
                };

                // Siderischer Tag: 23h 56m 4s = 1436.067 Minuten
                const SIDEREAL_DAY_MINUTES = 23 * 60 + 56 + 4/60; // 1436.067 Minuten
                const SOLAR_DAY_MINUTES = 24 * 60; // 1440 Minuten

                btnDayMinus.addEventListener('click', () => applyDelta(-SOLAR_DAY_MINUTES));
                btnHourMinus.addEventListener('click', () => applyDelta(-60));
                btnNow.addEventListener('click', async () => {
                    settingsManager.setSimulatedTime(0);
                    updateSimPreview();
                    if (renderer) {
                        await updateSky();
                        // Refresh object dialog if visible (after update completes)
                        renderer.refreshDialogIfVisible();
                    }
                    // Refresh cache status for returning to real-time
                    try { refreshCacheStatus(); } catch (_) { /* noop */ }
                    try { if (__csSecondPassTimer) clearTimeout(__csSecondPassTimer); } catch (_) { /* noop */ }
                    __csSecondPassTimer = setTimeout(() => { try { refreshCacheStatus(); } catch (_) { /* noop */ } }, 3000);
                });
                btnHourPlus.addEventListener('click', () => applyDelta(60));
                btnDayPlus.addEventListener('click', () => applyDelta(SOLAR_DAY_MINUTES));
                
                // Mache die Zeitanzeige klickbar
                timeDisplay.addEventListener('click', () => {
                    // Lade die CSS-Datei für den Zeit-Dialog
                    loadCSSFile('./static/css/timeInputDialog.css');
                    // Zeige den Dialog an
                    timeInputDialog.show();
                });
                timeDisplay.title = t('click_to_set_time') || 'Klicken, um eine benutzerdefinierte Zeit einzugeben';

                updateSimPreview();
                // Laufende Aktualisierung der Anzeige jede Sekunde
                if (!window.__simTimeTicker) {
                    window.__simTimeTicker = setInterval(updateSimPreview, 1000);
                }
            } catch (e) {
                console.error('Failed to setup simulated time controls:', e);
            }
        }

        function updateSimPreview() {
            try {
                const el = document.getElementById('sim-time-local');
                if (!el) return;
                const sim = settingsManager.getSimulatedTimeOffset();
                const off = (sim && typeof sim.offsetMinutes === 'number') ? sim.offsetMinutes : 0;
                const dt = new Date(Date.now() + off * 60000);
                // Format date and time using current UI language
                const lang = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : 'de';
                const locale = lang === 'en' ? 'en-US' : 'de-DE';
                const dateStr = dt.toLocaleDateString(locale, { day: '2-digit', month: '2-digit' });
                const timeStr = dt.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                el.textContent = `${dateStr} ${timeStr}`;
            } catch (_) { /* noop */ }
        }
        
        // Funktion zum Laden einer CSS-Datei
        function loadCSSFile(url) {
            // Prüfe, ob die CSS-Datei bereits geladen wurde
            const links = document.getElementsByTagName('link');
            for (let i = 0; i < links.length; i++) {
                if (links[i].href.includes(url)) {
                    return; // CSS bereits geladen
                }
            }
            
            // Füge die CSS-Datei hinzu
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = url;
            document.head.appendChild(link);
        }
        
        // Handler für Standortänderungen
        async function handleLocationChange(location) {
            // Aktualisiere den Titel mit dem neuen Standort und i18n-Unterstützung
            updateAppTitle(location.name);
            
            // Aktualisiere die Koordinaten im SkyManager
            if (renderer && renderer.skyManager) {
                renderer.skyManager.setLocation(location.lat, location.lon, location.elevation);
                // Aktualisiere den Himmel mit der exportierten updateSky-Funktion
                updateSky();
            }

            // Aktualisiere Cache-Status für diesen Standort
            try { updateCacheStatusForLocation(location.lat, location.lon, location.elevation, location.name); } catch (_) { /* noop */ }
            
            // Speichere den Standort im localStorage für Persistenz
            saveLocationToLocalStorage(location);
            
            // Speichere den Standort über den SettingsManager und synchronisiere mit dem Server
            try {
                await settingsManager.setLocation(location.lat, location.lon, location.elevation, location.name);
                console.log('Location saved to server via SettingsManager');
            } catch (error) {
                console.error('Error saving location to server:', error);
            }
        }
        
        // Funktion zum Speichern des Standorts im localStorage
        function saveLocationToLocalStorage(location) {
            try {
                localStorage.setItem('asciisky_location', JSON.stringify(location));
                console.log('Location saved to localStorage:', location);
            } catch (error) {
                console.error('Error saving location to localStorage:', error);
            }
        }
        
        function setupObjectList() {
            const container = document.getElementById('object-list');
            if (!container) return;
            
            // Leere den Container zuerst
            container.innerHTML = '';
            
            // Verwende OBJECT_SYMBOLS direkt, nicht über CONFIG
            Object.entries(OBJECT_SYMBOLS).forEach(([name, symbol]) => {
                // Asteroiden und Kometen nicht anzeigen
                if (name === 'asteroid' || name === 'comet') return;
                
                const btn = document.createElement('button');
                btn.className = 'object-btn';
                btn.dataset.objectName = name; // Speichere den originalen Namen als Datensatz
                const displayName = t(name) || name.charAt(0).toUpperCase() + name.slice(1);
                btn.innerHTML = `${symbol} ${displayName}`;
                btn.onclick = () => {
                    // Toggle selection
                    const isSelected = btn.classList.contains('active');
                    document.querySelectorAll('.object-btn').forEach(b => b.classList.remove('active'));
                    
                    if (!isSelected && renderer) {
                        btn.classList.add('active');
                        renderer.selectObject(name, true); // true = show dialog
                    } else if (renderer) {
                        renderer.clearSelection();
                    }
                };
                container.appendChild(btn);
            });
            
            // Sternbilder-Button hinzufügen
            if (CONFIG.CONSTELLATIONS?.ENABLE_CONSTELLATION_LAYER) {
                const constellationBtn = document.createElement('button');
                constellationBtn.id = 'constellation-toggle';
                constellationBtn.className = 'object-btn';
                constellationBtn.innerHTML = '✦ ' + t('constellations');
                constellationBtn.title = t('toggle_constellations');
                constellationBtn.onclick = async () => {
                    if (renderer && renderer.zodiacRenderer) {
                        // Load data if not already loaded
                        if (renderer.zodiacRenderer.constellations.length === 0) {
                            const location = renderer.location || settingsManager.getLocation();
                            const timeISO = settingsManager.getSimulatedTimeISO && settingsManager.getSimulatedTimeISO();
                            await renderer.zodiacRenderer.fetchZodiacData(location, timeISO);
                        }
                        
                        renderer.zodiacRenderer.toggleVisibility();
                        // Update button appearance
                        const isActive = renderer.zodiacRenderer.visible;
                        constellationBtn.classList.toggle('active', isActive);
                    }
                };
                container.appendChild(constellationBtn);
            }
        }
        
        // Funktion zum Einrichten der Navigationspfeile - nicht mehr benötigt, da im SkyRenderer implementiert
        function setupNavigationArrows() {
            // Leere Funktion, da die Pfeile jetzt im SkyRenderer erstellt werden
            console.log('Navigation arrows are now created in SkyRenderer');
        }
        
        function setupMagnitudeFilters() {
            // Leere Funktion für Kompatibilität
        }
    </script>
</body>
</html>
