<!DOCTYPE html>
<html lang="de" data-theme="green">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050805">
    <meta name="description" content="ASCII Sky: der Himmel über deinem Standort als ASCII-Karte">
    <title>ASCII Sky</title>
    <script>
        // Apply the stored theme before the first paint (no flash of green).
        try {
            var s = JSON.parse(localStorage.getItem('asciisky_settings') || 'null');
            if (s && ['green', 'red', 'blue', 'amber'].indexOf(s.theme) >= 0) document.documentElement.dataset.theme = s.theme;
            if (s && (s.language === 'de' || s.language === 'en')) document.documentElement.lang = s.language;
        } catch (e) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/sky.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
<a class="skip-link" href="#sky" data-i18n="skip_to_sky">Zum Himmel</a>

<header class="app-bar">
    <button id="location-btn" class="app-title" type="button">
        <span class="brand" aria-hidden="true">✦</span>
        <span class="title-text">
            <span class="app-name" data-i18n="app_title">ASCII Sky</span>
            <span id="location-name" class="location-name"></span>
        </span>
    </button>

    <div id="time-bar" class="time-bar" role="group" data-i18n-aria="sim_time_controls">
        <button id="time-day-minus" class="icon-btn" type="button" data-i18n-title="help_day_minus">«</button>
        <button id="time-hour-minus" class="icon-btn" type="button" data-i18n-title="help_hour_minus">‹</button>
        <button id="time-display" class="time-display" type="button" data-i18n-title="click_to_set_time">
            <span id="time-date"></span>
            <span id="time-clock"></span>
            <span id="time-sim" class="sim-badge" hidden data-i18n="sim_badge">SIM</span>
        </button>
        <button id="time-hour-plus" class="icon-btn" type="button" data-i18n-title="help_hour_plus">›</button>
        <button id="time-day-plus" class="icon-btn" type="button" data-i18n-title="help_day_plus">»</button>
        <button id="time-now" class="icon-btn" type="button" data-i18n-title="help_now">⟳</button>
    </div>

    <div class="app-actions">
        <span id="loading" class="loading-dot" hidden data-i18n-title="loading"></span>
        <button id="appearance-btn" class="icon-btn" type="button" data-i18n-title="appearance">🎨</button>
        <button id="auth-btn" class="icon-btn" type="button" data-i18n-title="login_register">👤</button>
        <button id="help-btn" class="icon-btn" type="button" data-i18n-title="help_title">?</button>
    </div>
</header>

<main class="layout">
    <aside id="list-panel" class="panel list-panel" aria-labelledby="list-title"></aside>

    <section class="sky-panel" data-i18n-aria="sky_region">
        <div class="sky-toolbar">
            <div class="segmented" role="tablist" data-i18n-aria="view_mode">
                <button id="view-horizon" class="seg-btn" type="button" role="tab" aria-selected="true" data-i18n="horizon_view">Horizont</button>
                <button id="view-planisphere" class="seg-btn" type="button" role="tab" aria-selected="false" data-i18n="planisphere_view">Planisphäre</button>
            </div>
            <div class="layer-toggles" role="group" data-i18n-aria="layers">
                <button id="layer-constellations" class="toggle-btn" type="button" aria-pressed="false" data-i18n-title="constellations">✦</button>
                <button id="layer-messier" class="toggle-btn" type="button" aria-pressed="false" data-i18n-title="messier">✧</button>
                <button id="layer-grid" class="toggle-btn" type="button" aria-pressed="true" data-i18n-title="grid">⌗</button>
                <button id="sunpath-btn" class="toggle-btn" type="button" data-i18n-title="sunpath_curve">☉</button>
            </div>
            <div class="zoom-controls" role="group" data-i18n-aria="zoom">
                <button id="zoom-out" class="icon-btn" type="button" data-i18n-title="zoom_out">−</button>
                <span id="zoom-label" class="zoom-label"></span>
                <button id="zoom-in" class="icon-btn" type="button" data-i18n-title="zoom_in">+</button>
            </div>
        </div>

        <div id="status-banner" class="status-banner" role="status" hidden>
            <span id="status-text"></span>
            <button id="status-retry" class="btn btn-small" type="button" data-i18n="retry">Erneut versuchen</button>
        </div>

        <div id="sky" class="sky-viewport" tabindex="0" role="application" data-i18n-aria="sky_help_short"></div>

        <div class="sky-footer">
            <button id="turn-left" class="icon-btn" type="button" data-i18n-title="turn_left">◁</button>
            <span id="compass" class="compass" aria-live="polite"></span>
            <button id="turn-right" class="icon-btn" type="button" data-i18n-title="turn_right">▷</button>
            <span id="counts" class="counts"></span>
        </div>
    </section>

    <aside id="detail-panel" class="panel detail-panel" hidden></aside>
</main>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
