      - LOG_LEVEL=info
    restart: unless-stopped
    profiles: ["rabbitmq"]
  
  comet-worker-2:
    image: asciisky-worker
    build: .
    command: ["python", "workers/comet_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@localhost:5672/
      - WORKER_ID=comet-worker-2
      - LOG_LEVEL=info
    restart: unless-stopped
    profiles: ["rabbitmq"]
  
  celestial-worker-1:
    image: asciisky-worker
    build: .
    command: ["python", "workers/celestial_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@localhost:5672/
      - WORKER_ID=celestial-worker-1
      - LOG_LEVEL=info
    restart: unless-stopped
    profiles: ["rabbitmq"]
  
  constellation-worker-1:
