services:
  # ===== PostgreSQL Service =====
  postgres:
    image: postgres:16
    container_name: asciisky-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      
      # Performance Tuning für AsciiSky (Development - weniger aggressiv)
      - POSTGRES_SHARED_BUFFERS=512MB         # 25% of 2GB RAM (Development)
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1536MB  # 75% of 2GB RAM
      - POSTGRES_MAINTENANCE_WORK_MEM=128MB   # Für VACUUM, CREATE INDEX
      - POSTGRES_WORK_MEM=8MB                 # Pro Query (Development)
      - POSTGRES_MAX_CONNECTIONS=50           # Ausreichend für Dev
      - POSTGRES_RANDOM_PAGE_COST=1.1         # SSD optimiert
      - POSTGRES_EFFECTIVE_IO_CONCURRENCY=200 # SSD optimiert
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asciisky"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== RabbitMQ Service =====
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: asciisky-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-changeme}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Web Service =====
  web:
    image: asciisky-web
    build: .
    pull_policy: never
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # Session Secret (für Prod sinnvoll ändern)
      - ASCII_SKY_SESSION_SECRET=c93d3747775793487777579348777757
      # Magnitude limits for asteroids and comets
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      # Event computation limits
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # RabbitMQ - NUR neue Architektur!
      - USE_RABBITMQ=true
      - USE_RABBITMQ_ASTEROIDS=true
      - USE_RABBITMQ_COMETS=true
      - RABBITMQ_PERCENTAGE=100
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_TIMEOUT=120
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      # Smart Interpolation
      - ENABLE_SMART_INTERPOLATION=${ENABLE_SMART_INTERPOLATION:-true}
      - INTERPOLATION_STRATEGY=${INTERPOLATION_STRATEGY:-smart_interpolation}
      - ENABLE_ON_DEMAND_COMPUTATION=${ENABLE_ON_DEMAND_COMPUTATION:-true}
      - INTERPOLATION_ENABLED_PERCENTAGE=${INTERPOLATION_ENABLED_PERCENTAGE:-100.0}
      - ENABLE_INTERPOLATION_BACKGROUND_TASKS=${ENABLE_INTERPOLATION_BACKGROUND_TASKS:-true}
      - INTERPOLATION_CACHE_COMPUTED=${INTERPOLATION_CACHE_COMPUTED:-true}
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ===== Data Updater =====
  data_updater:
    image: asciisky-worker
    build: .
    pull_policy: never
    command: ["python", "nightly_data_updater.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_UPDATE_HOUR=4
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ===== Precompute Coordinator =====
  precompute_coordinator:
    image: asciisky-worker
    build: .
    pull_policy: never
    command: ["python", "precompute_coordinator.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_PRECOMPUTE_HOURS=${ASCII_SKY_PRECOMPUTE_HOURS:-720}
      - PRECOMPUTE_COORDINATOR_INTERVAL=${PRECOMPUTE_COORDINATOR_INTERVAL:-3600}
      - PRECOMPUTE_COORDINATOR_RETRY_INTERVAL=${PRECOMPUTE_COORDINATOR_RETRY_INTERVAL:-30}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
    restart: unless-stopped

  # ===== Precompute Worker (skalierbar mit --scale precompute_worker=N) =====
  precompute_worker:
    image: asciisky-worker
    build: .
    pull_policy: never
    command: ["python", "workers/precompute_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # WORKER_ID wird automatisch von Docker gesetzt (Container-Name)
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # RabbitMQ Configuration
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      # Magnitude Limits
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${PRECOMPUTE_WORKERS:-4}  # Anzahl aus .env (Default: 4)

  # ===== RABBITMQ WORKER (skalierbar) =====
  
  asteroid-worker:
    image: asciisky-worker
    build: .
    pull_policy: never
    command: ["python", "workers/asteroid_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${ASTEROID_WORKERS:-2}  # Anzahl aus .env (Default: 2)
  
  comet-worker:
    image: asciisky-worker
    build: .
    pull_policy: never
    command: ["python", "workers/comet_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${COMET_WORKERS:-2}  # Anzahl aus .env (Default: 2)
  

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
