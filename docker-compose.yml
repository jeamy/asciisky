services:
  # ===== PostgreSQL Service =====
  postgres:
    image: postgres:16-alpine
    container_name: asciisky-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asciisky"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== RabbitMQ Service =====
  rabbitmq:
    image: rabbitmq:4.1.3-management
    container_name: asciisky-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-changeme}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Web Service =====
  web:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_ENV=development
      # Session Secret (für Prod sinnvoll ändern)
      - ASCII_SKY_SESSION_SECRET=${SESSION_SECRET:-local-development-only}
      # Magnitude limits for asteroids and comets
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      # Event computation limits
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # RabbitMQ - NUR neue Architektur!
      - USE_RABBITMQ=true
      - USE_RABBITMQ_ASTEROIDS=true
      - USE_RABBITMQ_COMETS=true
      - RABBITMQ_PERCENTAGE=100
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_TIMEOUT=120
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      # Smart Interpolation
      - ENABLE_SMART_INTERPOLATION=${ENABLE_SMART_INTERPOLATION:-true}
      - INTERPOLATION_STRATEGY=${INTERPOLATION_STRATEGY:-smart_interpolation}
      - ENABLE_ON_DEMAND_COMPUTATION=${ENABLE_ON_DEMAND_COMPUTATION:-true}
      - INTERPOLATION_ENABLED_PERCENTAGE=${INTERPOLATION_ENABLED_PERCENTAGE:-100.0}
      - ENABLE_INTERPOLATION_BACKGROUND_TASKS=${ENABLE_INTERPOLATION_BACKGROUND_TASKS:-true}
      - INTERPOLATION_CACHE_COMPUTED=${INTERPOLATION_CACHE_COMPUTED:-true}
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ===== Data Updater =====
  data_updater:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "nightly_data_updater.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_UPDATE_HOUR=4
      # Optional FTP source. Disable it to use the HTTP fallback.
      - FTP_DISABLED=${FTP_DISABLED:-true}
      - FTP_SERVER=${FTP_SERVER:-}
      - FTP_PORT=${FTP_PORT:-21}
      - FTP_SCHEME=${FTP_SCHEME:-ftp}
      - FTP_USER=${FTP_USER:-}
      - FTP_PASSWD=${FTP_PASSWD:-}
      - FTP_UPLOAD=${FTP_UPLOAD:-}
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ===== Precompute Coordinator =====
  precompute_coordinator:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "precompute_coordinator.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_PRECOMPUTE_HOURS=${ASCII_SKY_PRECOMPUTE_HOURS:-720}
      - PRECOMPUTE_COORDINATOR_INTERVAL=${PRECOMPUTE_COORDINATOR_INTERVAL:-3600}
      - PRECOMPUTE_COORDINATOR_RETRY_INTERVAL=${PRECOMPUTE_COORDINATOR_RETRY_INTERVAL:-30}
      - PRECOMPUTE_TASK_CLAIM_TTL=${PRECOMPUTE_TASK_CLAIM_TTL:-86400}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ===== Unified Worker (für lokales Testing) =====
  # Ersetzt: precompute_worker + asteroid_worker + comet_worker
  # Verarbeitet alle Task-Typen in einem Worker
  # HYBRID DEDUPLICATION: RabbitMQ Message Deduplication + PostgreSQL Advisory Locks
  unified_worker:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "workers/unified_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # RabbitMQ Configuration
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-1}
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      # Hybrid Deduplication Configuration
      - ASCII_SKY_DEDUPLICATION_TTL=${ASCII_SKY_DEDUPLICATION_TTL:-300}
      - ASCII_SKY_ADVISORY_LOCK_TTL=${ASCII_SKY_ADVISORY_LOCK_TTL:-300}
      - ENABLE_HYBRID_DEDUPLICATION=${ENABLE_HYBRID_DEDUPLICATION:-true}
      # Magnitude Limits
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-18.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-20.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-30}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-20}
      - ASCII_SKY_EVENT_GRID_MINUTES=${ASCII_SKY_EVENT_GRID_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import workers.unified_worker; print('Worker healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2  # Nur 2 Worker für lokales Testing
  
