services:
  web:
    image: asciisky-web
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_PRECOMPUTE_HOURS=144
      - ASCII_SKY_MAX_PRECOMPUTE_HOURS=168
      - ASCII_SKY_PRECOMPUTE_KINDS=celestial,asteroids,comets
    restart: unless-stopped
 
  worker:
    image: asciisky-worker
    build: .
    command: ["python", "precompute_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_PRECOMPUTE_HOURS=144
      - ASCII_SKY_MAX_PRECOMPUTE_HOURS=168
      - ASCII_SKY_PRECOMPUTE_KINDS=celestial,asteroids,comets
      - ASCII_SKY_PRECOMPUTE_WORKERS=4
      - ASCII_SKY_ADAPTIVE_WORKERS=1
      - ASCII_SKY_RETENTION_DAYS=30
    restart: unless-stopped
 
  worker_once:
    image: asciisky-worker
    build: .
    command: ["python", "precompute_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_PRECOMPUTE_HOURS=144
      - ASCII_SKY_MAX_PRECOMPUTE_HOURS=168
      - ASCII_SKY_PRECOMPUTE_KINDS=celestial,asteroids,comets
      - ASCII_SKY_PRECOMPUTE_WORKERS=4
      - ASCII_SKY_ADAPTIVE_WORKERS=1
      - ASCII_SKY_RETENTION_DAYS=30
      - ASCII_SKY_WORKER_RUN_ONCE=1
    restart: "no"
    profiles: ["once"]
