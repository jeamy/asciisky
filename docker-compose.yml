services:
  # ===== RabbitMQ Service =====
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: asciisky-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Web Service =====
  web:
    image: asciisky-web
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # Horizon für vom Webprozess getriggerte Fenster-Tasks (30 Tage)
      - ASCII_SKY_PRECOMPUTE_HOURS=720
      - ASCII_SKY_MAX_PRECOMPUTE_HOURS=720
      - ASCII_SKY_PRECOMPUTE_KINDS=asteroids,comets
      # Duplikate und Last begrenzen (siehe api/background.py)
      - ASCII_SKY_BG_TASK_COOLDOWN_MINUTES=1
      - ASCII_SKY_MAX_WINDOW_WORKERS=4
      # Session Secret (für Prod sinnvoll ändern)
      - ASCII_SKY_SESSION_SECRET=c93d3747775793487777579348777757
      # Magnitude limits for asteroids and comets
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=12.0
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=10.0
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=20.0
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=14.0
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=100
      - ASCII_SKY_COMET_EVENTS_MAX=50
      # RabbitMQ - NUR neue Architektur!
      - USE_RABBITMQ=true
      - USE_RABBITMQ_ASTEROIDS=true
      - USE_RABBITMQ_COMETS=true
      - RABBITMQ_PERCENTAGE=100
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - RABBITMQ_TIMEOUT=120
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ===== Data Updater =====
  data_updater:
    image: asciisky-worker
    build: .
    command: ["python", "nightly_data_updater.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_UPDATE_HOUR=4
    restart: unless-stopped

  # ===== Task Cleanup - OBSOLET (kann entfernt werden) =====
  # Wurde für alte api/background.py Task-Dateien benötigt
  # Diese werden mit RabbitMQ nicht mehr erstellt
  # task_cleanup:
  #   image: asciisky-worker
  #   build: .
  #   command: ["python", "task_cleanup_service.py"]
  #   volumes:
  #     - .:/app
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - TZ=Europe/Berlin
  #     - ASCII_SKY_TASK_CLEANUP_HOURS=6
  #     - ASCII_SKY_TASK_CLEANUP_INTERVAL=60
  #   restart: unless-stopped

  # ===== RABBITMQ WORKER =====
  
  asteroid-worker-1:
    image: asciisky-worker
    build: .
    command: ["python", "workers/asteroid_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - WORKER_ID=asteroid-worker-1
      - LOG_LEVEL=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  
  asteroid-worker-2:
    image: asciisky-worker
    build: .
    command: ["python", "workers/asteroid_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - WORKER_ID=asteroid-worker-2
      - LOG_LEVEL=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  
  comet-worker-1:
    image: asciisky-worker
    build: .
    command: ["python", "workers/comet_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - WORKER_ID=comet-worker-1
      - LOG_LEVEL=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  
  comet-worker-2:
    image: asciisky-worker
    build: .
    command: ["python", "workers/comet_worker.py"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - WORKER_ID=comet-worker-2
      - LOG_LEVEL=info
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  

volumes:
  rabbitmq_data:
    driver: local
