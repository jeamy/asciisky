# Docker Compose für Worker-Hosts ($RABBITMQ_B, $RABBITMQ_C)
# Worker für Precompute, Asteroid, Comet
#
# Worker-Typen:
# - Precompute: Vorausberechnung für bekannte Locations (stündlich)
# - Asteroid/Comet: On-Demand für API-Requests (neue Locations, Cache-Miss, etc.)
#
# Skalierung via .env (je nach Host):
# PRECOMPUTE_WORKERS=4 (default)
# ASTEROID_WORKERS=2 (default)
# COMET_WORKERS=2 (default)

services:
  # ===== Precompute Worker =====
  precompute_worker:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "workers/precompute_worker.py"]
    extra_hosts:
      - "${RABBITMQ_MAIN}:${RABBITMQ_MAIN_IP}"
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - POSTGRES_HOST=${RABBITMQ_MAIN}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@${RABBITMQ_MAIN}:5672/
      - RABBITMQ_PREFETCH_COUNT=1
      - RABBITMQ_HEARTBEAT=60
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
    restart: unless-stopped
    networks:
      - worker-net

  # ===== Asteroid Worker =====
  asteroid_worker:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "workers/asteroid_worker.py"]
    extra_hosts:
      - "${RABBITMQ_MAIN}:${RABBITMQ_MAIN_IP}"
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - POSTGRES_HOST=${RABBITMQ_MAIN}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@${RABBITMQ_MAIN}:5672/
      - RABBITMQ_PREFETCH_COUNT=1
      - RABBITMQ_HEARTBEAT=60
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
    restart: unless-stopped
    networks:
      - worker-net

  # ===== Comet Worker =====
  comet_worker:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "workers/comet_worker.py"]
    extra_hosts:
      - "${RABBITMQ_MAIN}:${RABBITMQ_MAIN_IP}"
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - POSTGRES_HOST=${RABBITMQ_MAIN}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@${RABBITMQ_MAIN}:5672/
      - RABBITMQ_PREFETCH_COUNT=1
      - RABBITMQ_HEARTBEAT=60
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
    restart: unless-stopped
    networks:
      - worker-net

networks:
  worker-net:
    driver: bridge
