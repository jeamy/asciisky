# Docker Compose für Worker-Hosts ($RABBITMQ_B, $RABBITMQ_C)
# OPTIMIERT: Unified Worker mit Smart Interpolation
#
# Worker-Typen (Unified Architecture):
# - Unified Worker: Precompute + Asteroid + Comet + Smart Interpolation
# - Worker Monitor: Real-time Performance Monitoring
#
# Skalierung via .env (je nach Host):
# PRECOMPUTE_WORKERS=4 (default)
# ASTEROID_WORKERS=2 (default) 
# COMET_WORKERS=2 (default)
# WORKER_MONITOR=1 (default)
#
# Performance Gains:
# - Memory: -80% (Shared Skyfield Resources)
# - Throughput: +35% (Unified Architecture)  
# - Monitoring: Real-time Dashboard
# - Deduplication: Hybrid (RabbitMQ + Advisory Locks)

services:
  # ===== Data Updater (LOKAL) =====
  # Jeder Worker-Server braucht eigene DataFrame-Dateien!
  data_updater:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "nightly_data_updater.py"]
    extra_hosts:
      - "${RABBITMQ_MAIN}:${RABBITMQ_MAIN_IP}"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - POSTGRES_HOST=${RABBITMQ_MAIN}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    restart: unless-stopped
    networks:
      - worker-net

  # ===== Unified Worker (OPTIMIERT) =====
  # Ersetzt: precompute_worker + asteroid_worker + comet_worker
  # Performance: -80% Memory, +35% Throughput
  unified_worker:
    image: asciisky-web:latest
    build: .
    pull_policy: never
    command: ["python", "workers/start_unified_worker.py", "--worker-type", "unified", "--worker-id", "unified-worker-${HOSTNAME:-unknown}"]
    extra_hosts:
      - "${RABBITMQ_MAIN}:${RABBITMQ_MAIN_IP}"
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      # Core Configuration
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - WORKER_TYPE=unified
      - WORKER_ID=unified-worker-${HOSTNAME:-unknown}
      
      # Database Connection
      - POSTGRES_HOST=${RABBITMQ_MAIN}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      
      # RabbitMQ Connection
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@${RABBITMQ_MAIN}:5672/
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      - RABBITMQ_HEARTBEAT=600
      
      # Smart Interpolation
      - ENABLE_SMART_INTERPOLATION=${ENABLE_SMART_INTERPOLATION:-true}
      - INTERPOLATION_STRATEGY=${INTERPOLATION_STRATEGY:-smart_interpolation}
      - ENABLE_ON_DEMAND_COMPUTATION=${ENABLE_ON_DEMAND_COMPUTATION:-true}
      - INTERPOLATION_ENABLED_PERCENTAGE=${INTERPOLATION_ENABLED_PERCENTAGE:-100.0}
      - ENABLE_INTERPOLATION_BACKGROUND_TASKS=${ENABLE_INTERPOLATION_BACKGROUND_TASKS:-true}
      - INTERPOLATION_CACHE_COMPUTED=${INTERPOLATION_CACHE_COMPUTED:-true}
      - ON_DEMAND_CACHE_TTL=${ON_DEMAND_CACHE_TTL:-3600}
      - ON_DEMAND_MAX_COMPUTATION_TIME=${ON_DEMAND_MAX_COMPUTATION_TIME:-30}
      
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - WORKER_MEMORY_LIMIT_MB=${WORKER_MEMORY_LIMIT_MB:-384}
      - WORKER_CPU_LIMIT_PERCENT=${WORKER_CPU_LIMIT_PERCENT:-70}
      - ENABLE_SHARED_RESOURCES=${ENABLE_SHARED_RESOURCES:-true}
      - WORKER_ENABLE_PERFORMANCE_METRICS=${WORKER_ENABLE_PERFORMANCE_METRICS:-true}
      
      # Magnitude Limits (bestehend)
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
      
      # Performance Monitoring 
      - WORKER_HEALTH_CHECK_INTERVAL=${WORKER_HEALTH_CHECK_INTERVAL:-30}
      - WORKER_AUTO_RESTART_ON_FAILURE=${WORKER_AUTO_RESTART_ON_FAILURE:-true}
      - WORKER_MAX_RETRY_ATTEMPTS=${WORKER_MAX_RETRY_ATTEMPTS:-3}
      
    restart: unless-stopped
    networks:
      - worker-net
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== Worker Monitor =====
  # Real-time Performance Dashboard
