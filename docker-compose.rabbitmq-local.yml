# Docker Compose für lokales RabbitMQ-Testing
# Verwendung: docker compose -f docker-compose.yml -f docker-compose.rabbitmq-local.yml up -d

services:
  # RabbitMQ für lokales Testing
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: asciisky-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Web Service - RabbitMQ URL anpassen
  web:
    environment:
      # RabbitMQ aktivieren (100% für Testing!)
      - USE_RABBITMQ=true
      - USE_RABBITMQ_ASTEROIDS=true
      - USE_RABBITMQ_COMETS=true
      - USE_RABBITMQ_CELESTIAL=true
      - USE_RABBITMQ_CONSTELLATIONS=true
      - RABBITMQ_PERCENTAGE=100
      - FALLBACK_TO_OLD_ON_ERROR=false
      # RabbitMQ URL (Container-Name!)
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
      - RABBITMQ_TIMEOUT=30
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Worker mit RabbitMQ URL
  asteroid-worker-1:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  asteroid-worker-2:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  comet-worker-1:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  comet-worker-2:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  celestial-worker-1:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  constellation-worker-1:
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
    driver: local
