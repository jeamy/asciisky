# Docker Compose für $RABBITMQ_MAIN
# Web-Server, RabbitMQ, PostgreSQL, Data Updater
# Worker laufen auf $RABBITMQ_B/$RABBITMQ_C

services:
  # ===== PostgreSQL Database =====
  postgres:
    image: postgres:16.4-alpine
    container_name: asciisky-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      
      # Performance Tuning (8 Cores, 16GB RAM, SSD - max 8GB für App)
      # KONSERVATIV: Defaults funktionierten, nur SSD-Optimierung + moderater Cache
      - POSTGRES_SHARED_BUFFERS=512MB         # 2GB RAM für PostgreSQL, 512MB Cache
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1536MB  # 75% of 2GB PostgreSQL RAM
      - POSTGRES_WORK_MEM=16MB                # Größer als Default (4MB) für DataFrames
      - POSTGRES_MAINTENANCE_WORK_MEM=256MB   # Für VACUUM, CREATE INDEX
      - POSTGRES_MAX_CONNECTIONS=100          # Default beibehalten
      - POSTGRES_RANDOM_PAGE_COST=1.1         # SSD-Optimierung (Default: 4.0)
      - POSTGRES_EFFECTIVE_IO_CONCURRENCY=200 # SSD-Optimierung (Default: 1)
      - POSTGRES_WAL_BUFFERS=16MB             # Write-Ahead Log
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asciisky -d asciisky"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - asciisky-net
    deploy:
      resources:
        limits:
          memory: 2G          # PostgreSQL max 2GB (von 8GB App-Budget)
        reservations:
          memory: 512M        # Mindestens 512MB

  # ===== RabbitMQ Service =====
  rabbitmq:
    image: rabbitmq:4.1.3-management
    container_name: asciisky-rabbitmq
    hostname: rabbitmq-asciisky
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-changeme}
      - RABBITMQ_DEFAULT_VHOST=/
      - RABBITMQ_NODENAME=rabbit@rabbitmq-asciisky
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - asciisky-net

  # ===== Web Service =====
  web:
    image: asciisky-web:latest
    container_name: asciisky-web
    build: .
    pull_policy: never
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./user_settings.json:/app/user_settings.json
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      
      # RabbitMQ Configuration
      - USE_RABBITMQ=true
      - USE_RABBITMQ_ASTEROIDS=true
      - USE_RABBITMQ_COMETS=true
      - RABBITMQ_PERCENTAGE=100
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_TIMEOUT=120
      
      # Session Secret (ÄNDERN für Produktion!)
      - ASCII_SKY_SESSION_SECRET=${SESSION_SECRET:-c93d3747775793487777579348777757}
      
      # Magnitude Limits
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      
      # Event Computation Limits
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
      
      # Smart Interpolation
      - ENABLE_SMART_INTERPOLATION=${ENABLE_SMART_INTERPOLATION:-true}
      - INTERPOLATION_STRATEGY=${INTERPOLATION_STRATEGY:-smart_interpolation}
      - ENABLE_ON_DEMAND_COMPUTATION=${ENABLE_ON_DEMAND_COMPUTATION:-true}
      - INTERPOLATION_ENABLED_PERCENTAGE=${INTERPOLATION_ENABLED_PERCENTAGE:-100.0}
      - ENABLE_INTERPOLATION_BACKGROUND_TASKS=${ENABLE_INTERPOLATION_BACKGROUND_TASKS:-true}
      - INTERPOLATION_CACHE_COMPUTED=${INTERPOLATION_CACHE_COMPUTED:-true}
      
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asciisky-net

  # ===== Data Updater =====
  data_updater:
    image: asciisky-web:latest
    container_name: asciisky-data-updater
    pull_policy: never
    command: ["python", "nightly_data_updater.py"]
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - ASCII_SKY_UPDATE_HOUR=2
      - FTP_DISABLED=${FTP_DISABLED:-true}
      - FTP_SERVER=${FTP_SERVER:-}
      - FTP_PORT=${FTP_PORT:-21}
      - FTP_SCHEME=${FTP_SCHEME:-ftp}
      - FTP_USER=${FTP_USER:-}
      - FTP_PASSWD=${FTP_PASSWD:-}
      - FTP_UPLOAD=${FTP_UPLOAD:-}
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asciisky-net

  # ===== Precompute Coordinator =====
  precompute_coordinator:
    image: asciisky-web:latest
    container_name: asciisky-precompute-coordinator
    pull_policy: never
    command: ["python", "precompute_coordinator.py"]
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
      - ./precompute_locations.json:/app/precompute_locations.json:ro
      - ./user_settings.json:/app/user_settings.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      
      # RabbitMQ Configuration
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=60
      
      # Precompute Settings
      - ASCII_SKY_PRECOMPUTE_HOURS=${ASCII_SKY_PRECOMPUTE_HOURS:-720}
      - PRECOMPUTE_COORDINATOR_INTERVAL=${PRECOMPUTE_COORDINATOR_INTERVAL:-3600}
      - PRECOMPUTE_COORDINATOR_RETRY_INTERVAL=${PRECOMPUTE_COORDINATOR_RETRY_INTERVAL:-30}
      
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asciisky-net

  # ===== Precompute Worker (Hauptserver, skalierbar) =====
  precompute_worker:
    image: asciisky-web:latest
    pull_policy: never
    command: ["python", "workers/precompute_worker.py"]
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      # WORKER_ID wird automatisch aus Hostname generiert (siehe precompute_worker.py)
      # Für Docker Swarm: WORKER_ID=precompute-worker-main-{{.Task.Slot}}
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-asciisky}
      - POSTGRES_USER=${POSTGRES_USER:-asciisky}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      
      # RabbitMQ Configuration
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT:-2}
      
      # Worker Configuration
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      
      # Magnitude Limits
      - ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG=${ASCII_SKY_ASTEROID_MAX_ABSOLUTE_MAG:-14.0}
      - ASCII_SKY_ASTEROID_MAX_APPARENT_MAG=${ASCII_SKY_ASTEROID_MAX_APPARENT_MAG:-10.0}
      - ASCII_SKY_COMET_MAX_ABSOLUTE_MAG=${ASCII_SKY_COMET_MAX_ABSOLUTE_MAG:-20.0}
      - ASCII_SKY_COMET_MAX_APPARENT_MAG=${ASCII_SKY_COMET_MAX_APPARENT_MAG:-14.0}
      - ASCII_SKY_ASTEROIDS_EVENTS_MAX=${ASCII_SKY_ASTEROIDS_EVENTS_MAX:-50}
      - ASCII_SKY_COMET_EVENTS_MAX=${ASCII_SKY_COMET_EVENTS_MAX:-50}
      
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asciisky-net
    deploy:
      replicas: ${PRECOMPUTE_WORKERS:-4}  # Anzahl aus .env

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  asciisky-net:
    driver: bridge
